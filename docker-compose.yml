version: '3.8'

services:
  api:
    build: .
    container_name: expense_tracker_api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite+aiosqlite:///./expense_tracker.db
      - JWT_SECRET_KEY=docker_dev_secret_key_1234567890
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
